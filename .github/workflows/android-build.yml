name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

# A newer commit on the same branch/PR cancels the older run, including its
# emulator job, so UI tests are spent only on the newest revision.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle caches downloaded dependencies and Gradle User Home
      # between runs. gradle.properties also enables Gradle's build/config cache.
      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Build the app and instrumentation-test APK before booting the emulator.
      # This avoids compiling test code while the emulator is waiting.
      - name: Run unit tests and prebuild APKs
        run: |
          gradle --console=plain --build-cache --configuration-cache \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Run Android UI regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          disable-animations: true
          script: |
            adb wait-for-device
            gradle --console=plain --build-cache --configuration-cache :app:connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: line-call-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
