name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: "Run JVM unit tests in addition to building the APK"
        required: true
        type: boolean
        default: false
      run_ui_tests:
        description: "Also boot an Android emulator and run UI regression tests"
        required: true
        type: boolean
        default: false

# Newer commits cancel older CI runs for the same branch/PR.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Fast default path: package the APK without emulator or test-runner setup.
      - name: Build preview APK
        run: gradle --console=plain --build-cache --configuration-cache :app:assembleDebug

      # Keep JVM tests available on PRs and on-demand, without slowing every APK build.
      - name: Run unit tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_unit_tests || inputs.run_ui_tests))
        run: gradle --console=plain --build-cache --configuration-cache :app:testDebugUnitTest

      # Emulator startup is slow and can fail independently of compilation.
      # Keep full UI regression coverage on PRs and make it opt-in for manual runs.
      - name: Build instrumentation APK
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_ui_tests)
        run: gradle --console=plain --build-cache --configuration-cache :app:assembleDebugAndroidTest

      - name: Run Android UI regression tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_ui_tests)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            gradle --console=plain --build-cache --configuration-cache :app:connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: line-call-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
