name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: "Run JVM unit tests in addition to building the APK"
        required: true
        type: boolean
        default: false
      run_ui_tests:
        description: "Also boot an Android emulator and run UI regression tests"
        required: true
        type: boolean
        default: false

# Keep one CI run per branch. A newer commit supersedes an older build.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KEYSTORE_PATH: ${{ github.event_name != 'pull_request' && format('{0}/my-upload-key.jks', github.workspace) || '' }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: upload
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Load the permanent Android signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 repository secret"; exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing STORE_PASSWORD repository secret"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD repository secret"; exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/linecall-signing-check.csr" \
            -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" >/dev/null
          rm -f "$RUNNER_TEMP/linecall-signing-check.csr"
          echo "Permanent signing key validated."

      - name: Generate PR-only debug key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build preview APK
        id: build_preview
        run: gradle --console=plain --build-cache --configuration-cache :app:assembleDebug

      - name: Build signed release APK
        id: build_release
        if: github.event_name == 'push'
        run: gradle --console=plain --build-cache --configuration-cache :app:assembleRelease

      - name: Run unit tests
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_unit_tests || inputs.run_ui_tests))
        run: gradle --console=plain --build-cache --configuration-cache :app:testDebugUnitTest

      - name: Upload debug APK
        if: always() && (success() || steps.build_preview.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: line-call-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
        id: upload_debug

      - name: Upload signed release APK
        if: github.event_name == 'push' && (success() || steps.build_release.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: line-call-v1.04-release-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
        id: upload_release

      - name: Remove signing key from runner
        if: always()
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then rm -f "$KEYSTORE_PATH"; fi

  # Emulator/UI tests are opt-in only. They never delay the release APK build.
  ui-regression-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate UI-test-only debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build instrumentation APK
        run: gradle --console=plain --build-cache --configuration-cache :app:assembleDebugAndroidTest

      - name: Run Android UI regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            gradle --console=plain --build-cache --configuration-cache :app:connectedDebugAndroidTest
